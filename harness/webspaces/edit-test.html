<!DOCTYPE html>
<html>
<body>
  <!--
    A webspace authored in the canonical semantic format WorldImporter consumes:
    each media element carries a 7-character id and a CSS `transform` whose
    translate3d uses cm units (100cm = 1 metre). Importing this HTML *is* editing
    the webspace's contents.
  -->
  <img id="hrnimg1" src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg"
       style="transform: translate3d(-120cm, 160cm, 0cm);" />
  <label id="hrnlbl1"
         style="transform: translate3d(120cm, 180cm, 0cm); font-family: sans-serif; color: rgb(255, 255, 255);">
    Edited by the harness
  </label>
</body>
</html>
